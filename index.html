<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Discovered Planets Catalog</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(18, 26, 43, 0.7);
            --border-color: rgba(0, 242, 254, 0.2);
            --primary-cyan: #00f2fe;
            --primary-teal: #4facfe;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 15px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 242, 254, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(79, 172, 254, 0.05) 0%, transparent 20%);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-teal));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 12px;
            font-size: 0.85rem;
        }

        .badge {
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid var(--border-color);
            padding: 4px 12px;
            border-radius: 20px;
            color: var(--primary-cyan);
        }

        /* Controls Section */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-cyan);
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px 12px 42px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: var(--primary-cyan);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        .filters {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-sub);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-teal));
            color: #000;
            font-weight: 600;
            border-color: transparent;
        }

        /* Planet Grid */
        .planet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .planet-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
        }

        .planet-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary-cyan);
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.15);
            background: rgba(18, 26, 43, 0.9);
        }

        .planet-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .planet-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(0, 242, 254, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-cyan);
            font-size: 1.1rem;
        }

        .planet-details h3 {
            font-size: 1rem;
            font-weight: 600;
        }

        .planet-details span {
            font-size: 0.75rem;
            color: var(--text-sub);
            display: block;
            margin-top: 2px;
        }

        .arrow-icon {
            color: var(--text-sub);
            font-size: 0.85rem;
            transition: 0.3s;
        }

        .planet-card:hover .arrow-icon {
            color: var(--primary-cyan);
            transform: translateX(3px);
        }

        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            padding: 40px;
            color: var(--text-sub);
        }

        @media (max-width: 600px) {
            .planet-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1><i class="fa-solid fa-globe"></i> Universe Planet Catalog</h1>
        <p>Aaj tak khoje gaye sabhi major grahon aur exoplanets ki soochii</p>
        <div class="stats-bar">
            <span class="badge" id="totalCount">Loading...</span>
        </div>
    </header>

    <div class="controls">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Grah ka naam khojein (e.g. Mars, Proxima, Kepler)...">
        </div>

        <div class="filters">
            <button class="filter-btn active" onclick="filterCategory('all')">All Planets</button>
            <button class="filter-btn" onclick="filterCategory('Solar System')">Solar System</button>
            <button class="filter-btn" onclick="filterCategory('Dwarf Planet')">Dwarf Planets</button>
            <button class="filter-btn" onclick="filterCategory('Exoplanet')">Exoplanets</button>
        </div>
    </div>

    <div class="planet-grid" id="planetGrid">
        <!-- Dynamic Cards Load Here -->
    </div>
</div>

<script>
    // Comprehensive List of All Discovered Planets & Major Exoplanet Systems
    const planetsData = [
        // Solar System Planets
        { name: "Mercury", type: "Solar System", disc: "Ancient" },
        { name: "Venus", type: "Solar System", disc: "Ancient" },
        { name: "Earth", type: "Solar System", disc: "Home" },
        { name: "Mars", type: "Solar System", disc: "Ancient" },
        { name: "Jupiter", type: "Solar System", disc: "Ancient" },
        { name: "Saturn", type: "Solar System", disc: "Ancient" },
        { name: "Uranus", type: "Solar System", disc: "1781" },
        { name: "Neptune", type: "Solar System", disc: "1846" },

        // Confirmed Dwarf Planets
        { name: "Pluto", type: "Dwarf Planet", disc: "1930" },
        { name: "Eris", type: "Dwarf Planet", disc: "2005" },
        { name: "Haumea", type: "Dwarf Planet", disc: "2004" },
        { name: "Makemake", type: "Dwarf Planet", disc: "2005" },
        { name: "Ceres", type: "Dwarf Planet", disc: "1801" },

        // Prominent Nearby & Earth-like Exoplanets
        { name: "Proxima Centauri b", type: "Exoplanet", disc: "2016" },
        { name: "Proxima Centauri c", type: "Exoplanet", disc: "2020" },
        { name: "Proxima Centauri d", type: "Exoplanet", disc: "2022" },
        { name: "TRAPPIST-1 b", type: "Exoplanet", disc: "2016" },
        { name: "TRAPPIST-1 c", type: "Exoplanet", disc: "2016" },
        { name: "TRAPPIST-1 d", type: "Exoplanet", disc: "2016" },
        { name: "TRAPPIST-1 e", type: "Exoplanet", disc: "2017" },
        { name: "TRAPPIST-1 f", type: "Exoplanet", disc: "2017" },
        { name: "TRAPPIST-1 g", type: "Exoplanet", disc: "2017" },
        { name: "TRAPPIST-1 h", type: "Exoplanet", disc: "2017" },
        { name: "LHS 1140 b", type: "Exoplanet", disc: "2017" },
        { name: "LHS 1140 c", type: "Exoplanet", disc: "2019" },
        { name: "Ross 128 b", type: "Exoplanet", disc: "2017" },
        { name: "GJ 667 C c", type: "Exoplanet", disc: "2011" },
        { name: "GJ 1061 d", type: "Exoplanet", disc: "2019" },
        { name: "Teegarden b", type: "Exoplanet", disc: "2019" },
        { name: "Teegarden c", type: "Exoplanet", disc: "2019" },
        { name: "K2-18 b", type: "Exoplanet", disc: "2015" },
        { name: "Luyten b", type: "Exoplanet", disc: "2017" },
        { name: "51 Pegasi b", type: "Exoplanet", disc: "1995" },
        { name: "HD 209458 b", type: "Exoplanet", disc: "1999" },

        // Notable Kepler Telescope Discoveries
        { name: "Kepler-22b", type: "Exoplanet", disc: "2011" },
        { name: "Kepler-452b", type: "Exoplanet", disc: "2015" },
        { name: "Kepler-186f", type: "Exoplanet", disc: "2014" },
        { name: "Kepler-16b", type: "Exoplanet", disc: "2011" },
        { name: "Kepler-442b", type: "Exoplanet", disc: "2015" },
        { name: "Kepler-62f", type: "Exoplanet", disc: "2013" },
        { name: "Kepler-62e", type: "Exoplanet", disc: "2013" },
        { name: "Kepler-10b", type: "Exoplanet", disc: "2011" },
        { name: "Kepler-90i", type: "Exoplanet", disc: "2017" },

        // TESS & Modern Discoveries
        { name: "TOI-700 d", type: "Exoplanet", disc: "2020" },
        { name: "TOI-700 e", type: "Exoplanet", disc: "2023" },
        { name: "TOI-1452 b", type: "Exoplanet", disc: "2022" },
        { name: "SPECULOOS-3 b", type: "Exoplanet", disc: "2024" },
        { name: "WASP-12b", type: "Exoplanet", disc: "2008" },
        { name: "WASP-76b", type: "Exoplanet", disc: "2013" },
        { name: "HD 189733 b", type: "Exoplanet", disc: "2005" },
        { name: "Gliese 581 c", type: "Exoplanet", disc: "2007" },
        { name: "Gliese 581 g", type: "Exoplanet", disc: "2010" }
    ];

    let currentCategory = 'all';

    function renderPlanets(data) {
        const grid = document.getElementById('planetGrid');
        grid.innerHTML = '';

        if (data.length === 0) {
            grid.innerHTML = `<div class="no-results"><i class="fa-solid fa-circle-exclamation fa-2x"></i><br><br>Koi grah nahi mila!</div>`;
            return;
        }

        data.forEach(planet => {
            // Convert spaces and special characters into filename safe string (e.g., "Proxima-Centauri-b.html")
            const fileName = planet.name.replace(/\s+/g, '-') + '.html';

            const card = document.createElement('a');
            card.href = fileName;
            card.className = 'planet-card';

            let iconClass = 'fa-planet-ringed';
            if (planet.type === 'Solar System') iconClass = 'fa-globe-americas';
            else if (planet.type === 'Dwarf Planet') iconClass = 'fa-circle-dot';
            else iconClass = 'fa-meteor';

            card.innerHTML = `
                <div class="planet-info">
                    <div class="planet-icon">
                        <i class="fa-solid ${iconClass}"></i>
                    </div>
                    <div class="planet-details">
                        <h3>${planet.name}</h3>
                        <span>${planet.type} • ${planet.disc}</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            `;
            grid.appendChild(card);
        });

        document.getElementById('totalCount').innerText = `Total Listed: ${data.length} Planets`;
    }

    function filterCategory(cat) {
        currentCategory = cat;
        
        // Update active class on buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.remove('active');
            if(btn.innerText.toLowerCase().includes(cat.toLowerCase()) || (cat === 'all' && btn.innerText.includes('All'))) {
                btn.classList.add('active');
            }
        });

        applyFilters();
    }

    function applyFilters() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        
        const filtered = planetsData.filter(p => {
            const matchesCat = (currentCategory === 'all') || (p.type === currentCategory);
            const matchesSearch = p.name.toLowerCase().includes(searchTerm) || p.type.toLowerCase().includes(searchTerm);
            return matchesCat && matchesSearch;
        });

        renderPlanets(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', applyFilters);

    // Initial Render
    renderPlanets(planetsData);
</script>
</body>
</html>
